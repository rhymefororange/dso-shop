<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSO-Shop — навчальний інтернет-магазин</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <h1>DSO-Shop</h1>
    <p class="tagline">Навчальний інтернет-магазин курсу DevSecOps</p>
    <nav>
      <a href="/">Каталог</a>
      <a href="/static/about.html">Про проєкт</a>
      <a href="/api/health">Стан сервісу</a>
    </nav>
  </header>

  <main>
    <section id="search">
      <form id="search-form">
        <label for="q">Пошук товарів</label>
        <input id="q" name="q" type="search" placeholder="наприклад, mug" maxlength="100">
        <button type="submit">Знайти</button>
      </form>
    </section>

    <section id="catalog">
      <h2>Каталог</h2>
      <ul id="products"></ul>
    </section>

    <section id="account">
      <h2>Обліковий запис</h2>
      <form id="login-form">
        <label for="username">Логін</label>
        <input id="username" name="username" autocomplete="username">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
        <button type="submit">Увійти</button>
      </form>
      <p id="login-status"></p>
    </section>

    <section id="cart-section">
      <h2>Кошик</h2>
      <ul id="cart"></ul>
      <p id="cart-total"></p>
      <button id="checkout" type="button">Оформити замовлення</button>
      <p id="checkout-status"></p>
    </section>
  </main>

  <footer>
    <p>Навчальний проєкт. Не використовуйте справжні персональні або платіжні дані.</p>
  </footer>
  <script src="/static/app.js"></script>
</body>
</html>
